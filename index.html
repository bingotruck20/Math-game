<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <!-- Nødvendige meta-tags for Safari/iOS Web App -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Monster-Zoo Sikkerhed</title>
    <style>
        /* Base Reset & Safari Optimering */
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            background: #1a1a2e; color: white; 
            height: 100dvh; /* Dynamic Viewport Height løser Safari-menu bug */
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            overflow: hidden;
        }

        /* Spil UI */
        #game-area { width: 90%; max-width: 400px; text-align: center; }
        .enclosure { 
            background: #16213e; margin: 20px auto; position: relative;
            display: flex; align-items: center; justify-content: center;
            border: 2px dashed #444; transition: all 0.3s ease;
        }
        .monster { font-size: 3rem; transition: transform 0.3s ease; }
        
        /* Animationer til "Fun Failure" */
        @keyframes escape {
            0% { transform: scale(1) translate(0, 0); }
            50% { transform: scale(2) translate(0, -50px); }
            100% { transform: scale(1) translate(0, 0); }
        }
        @keyframes zap {
            0% { filter: brightness(1); transform: rotate(0deg); }
            25% { filter: brightness(3) sepia(1) hue-rotate(-50deg); transform: rotate(10deg); }
            50% { filter: invert(1); transform: rotate(-10deg); }
            100% { filter: grayscale(1) brightness(0.2); transform: rotate(0deg); }
        }
        .anim-escape { animation: escape 1.5s ease; }
        .anim-zap { animation: zap 1s ease forwards; }
        .success-fence { border: 4px solid #0f3 !important; box-shadow: 0 0 15px #0f3; }

        /* Input og Knapper */
        input[type="number"] {
            width: 100%; padding: 15px; font-size: 1.2rem; border-radius: 8px;
            border: none; margin-bottom: 15px; text-align: center;
            background: #e94560; color: white; font-weight: bold;
        }
        input::placeholder { color: #f1a1b0; }
        button {
            width: 100%; padding: 15px; font-size: 1.2rem; border-radius: 8px;
            border: none; background: #0f3460; color: white; font-weight: bold;
            cursor: pointer;
        }
        button:active { transform: scale(0.98); }
        
        .measurements { font-size: 1.1rem; color: #a2a2d0; margin-bottom: 10px; }
    </style>
</head>
<body>

<div id="game-area">
    <h2>Bestil Laserhegn</h2>
    <p class="measurements" id="dimensions">Mål: Laster...</p>
    
    <div id="enclosure" class="enclosure" style="width: 200px; height: 150px;">
        <div id="monster" class="monster">👾</div>
    </div>

    <input type="number" id="userGuess" placeholder="Mængde hegn (meter)" pattern="[0-9]*" inputmode="numeric">
    <button onclick="checkFence()">Aktiver Hegn!</button>
</div>

<script>
    // System State
    let currentWidth, currentHeight, targetPerimeter;

    function initLevel() {
        // Generer random mål for et rektangel mellem 2 og 10
        currentWidth = Math.floor(Math.random() * 9) + 2;
        currentHeight = Math.floor(Math.random() * 9) + 2;
        
        // P = 2 * (l + b)
        targetPerimeter = 2 * (currentWidth + currentHeight);
        
        document.getElementById('dimensions').innerText = `Bredde: ${currentWidth}m | Længde: ${currentHeight}m`;
        
        // Reset visuelle elementer
        document.getElementById('enclosure').className = 'enclosure';
        document.getElementById('monster').className = 'monster';
        document.getElementById('monster').innerText = '👾';
        document.getElementById('userGuess').value = '';
    }

    function checkFence() {
        const guess = parseInt(document.getElementById('userGuess').value);
        const monster = document.getElementById('monster');
        const enclosure = document.getElementById('enclosure');
        
        // Reset animationer
        monster.className = 'monster';
        void monster.offsetWidth; // Trigger reflow for at genstarte CSS animation

        if (isNaN(guess)) return;

        if (guess === targetPerimeter) {
            // Succes
            enclosure.classList.add('success-fence');
            monster.innerText = '😎';
            setTimeout(() => {
                alert("Perfekt pasform! Næste monster...");
                initLevel();
            }, 1000);
        } else if (guess < targetPerimeter) {
            // For kort - Monstret slipper ud
            monster.classList.add('anim-escape');
            document.getElementById('dimensions').innerText = "Hul i hegnet! Monstret slap ud!";
        } else {
            // For langt - Kortslutning
            monster.classList.add('anim-zap');
            document.getElementById('dimensions').innerText = "Kortslutning! For meget hegn!";
            setTimeout(() => { monster.innerText = '💀'; }, 1000);
        }
    }

    // Start spillet
    initLevel();
</script>

</body>
</html>
